[project]
name = "pf2e-codex"
version = "0.1.0"
description = "PF2E rules knowledge base with MCP, CLI, and SDK interfaces"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.20",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "sqlite-vec>=0.1",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
export = ["optimum[onnxruntime]"]  # ONNX model export (one-time per model)
rocm = ["onnxruntime-rocm"]  # ROCm 6.x
cuda = ["onnxruntime-gpu"]
dev = ["pytest", "ruff", "mypy"]

# ROCm 7.x: install onnxruntime-migraphx from GitHub:
#   uv pip install https://github.com/Looong01/onnxruntime-rocm-build/releases/download/v1.25.0/onnxruntime_migraphx-1.25.0-cp313-cp313-manylinux_2_34_x86_64.whl

# GPU providers:
#   - ROCm: uv pip install onnxruntime-rocm
#   - CUDA: uv pip install onnxruntime-gpu
#   - MIGraphX (ROCm 7.x): uv pip install onnxruntime-migraphx
#   - CPU: onnxruntime is installed via optimum[onnxruntime]

[project.scripts]
pf2e-codex = "pf2e_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pf2e_codex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
