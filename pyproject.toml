[project]
name = "pf2e-codex"
version = "0.1.0"
description = "PF2E rules knowledge base with MCP, CLI, and SDK interfaces"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
onnx = ["optimum[onnxruntime]", "onnxruntime"]
rocm = ["optimum[onnxruntime]", "onnxruntime-rocm"]  # ROCm 6.x only
cuda = ["optimum[onnxruntime]", "onnxruntime-gpu"]
dev = ["pytest", "ruff", "mypy"]

# ROCm 7.x requires onnxruntime-migraphx from GitHub:
#   uv pip install optimum
#   uv pip install https://github.com/Looong01/onnxruntime-rocm-build/releases/download/v1.25.0/onnxruntime_migraphx-1.25.0-cp313-cp313-manylinux_2_34_x86_64.whl

[project.scripts]
pf2e-codex = "pf2e_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pf2e_codex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
