[project]
name = "pf2e-codex"
version = "0.1.0"
description = "PF2E rules knowledge base with MCP, CLI, and SDK interfaces"
requires-python = ">=3.12"
dependencies = [
    # Optimum uses Torch to export models; ONNX Runtime performs inference.
    "torch>=2.10",
    "optimum",
    "optimum-onnx",
    "einops",
    "sqlite-vec>=0.1",
    "mcp>=2.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "onnx>=1.21.0",
]

[project.optional-dependencies]
export = []  # Model-export deps are core; the hardware runtime is selected separately.
corpus = ["pdfplumber>=0.11,<0.12"]  # Native-text extraction for locally owned PDFs
cpu = ["onnxruntime>=1.20"]
rocm = ["onnxruntime-rocm"]  # ROCm 6.x
cuda = ["onnxruntime-gpu"]
dev = ["pytest", "ruff", "mypy"]

[dependency-groups]
dev = ["pytest"]

# Optimum needs Torch only while exporting a model to ONNX. Runtime inference
# is always handled by the hardware-selected ONNX Runtime package, so resolving
# PyPI's CUDA-flavoured Torch wheel here only adds NVIDIA libraries and breaks
# AMD development machines. Keep project-managed Torch explicitly CPU-only;
# separate visual-model experiments use their own hardware-specific environment.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# onnxruntime NOT in core deps — installed at build time based on GPU detection.
# Pick one at install time:
#   AMD: pip install onnxruntime-migraphx -f https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/
#   NVIDIA: pip install onnxruntime-gpu
#   CPU: pip install onnxruntime

[project.scripts]
pf2e-codex = "pf2e_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pf2e_codex"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
