[project]
name = "pf2e-codex"
version = "0.1.0"
description = "PF2E rules knowledge base with MCP, CLI, and SDK interfaces"
requires-python = ">=3.12"
dependencies = [
    "optimum",
    "optimum-onnx",
    "einops",
    "onnxruntime>=1.20",
    "sqlite-vec>=0.1",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
export = []  # ONNX model export — deps are in core (optimum, onnxruntime)
rocm = ["onnxruntime-rocm"]  # ROCm 6.x
cuda = ["onnxruntime-gpu"]
dev = ["pytest", "ruff", "mypy"]

# GPU providers:
#   - ROCm: uv pip install onnxruntime-rocm (official PyPI, version 1.22.2)
#   - CUDA: uv pip install onnxruntime-gpu
#   - CPU: onnxruntime is the default (pulled by core deps)

[project.scripts]
pf2e-codex = "pf2e_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pf2e_codex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
